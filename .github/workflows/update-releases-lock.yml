name: Update releases.lock

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Regenerate releases.lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x lib/update-releases.sh
          lib/update-releases.sh

      - name: Commit if changed
        run: |
          if ! git diff --quiet releases.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add releases.lock
            git commit -m "chore: update releases.lock"
            git push
          else
            echo "releases.lock unchanged — skipping commit"
          fi
